name: 'Myco PR Reviewer'
description: 'AI code-review / QA agent — reviews a pull request, posts findings as PR comments, optionally files tickets, and reports required Myco metrics.'
author: 'Myco'

inputs:
  pr_link:
    description: 'Full URL of the pull request (or compare link, e.g. .../compare/main...feature) to review.'
    required: true

  # ── LLM provider (BYO key) ──────────────────────────────────────────────
  llm_provider:
    description: '"openai" (default — any OpenAI-compatible endpoint: OpenAI itself, a LiteLLM proxy, Together, Groq, Gemini''s own OpenAI-compatible endpoint, etc) or "anthropic" (native Anthropic Messages API, for a raw Anthropic key).'
    required: false
    default: 'openai'
  api_key:
    description: 'API key for whichever llm_provider is configured — the recommended single input. Set llm_provider from a repo/org Variable named LLM_PROVIDER and this stays the same input either way, so switching providers never requires also swapping which input the key goes under. litellm_api_key / anthropic_api_key below still work and take precedence if set explicitly, for backward compatibility.'
    required: false
  litellm_api_key:
    description: '(Legacy — prefer api_key) API key for the LLM provider. Required when llm_provider is "openai" (the default) and api_key is not set.'
    required: false
  litellm_base_url:
    description: 'Base URL for the LLM provider''s OpenAI-compatible API. Defaults to OpenAI''s own endpoint. Only used when llm_provider is "openai".'
    required: false
    default: 'https://api.openai.com/v1'
  litellm_model:
    description: 'Model name to request from the provider. Only used when llm_provider is "openai".'
    required: false
    default: 'gpt-4.1'
  anthropic_api_key:
    description: '(Legacy — prefer api_key) Anthropic API key. Required when llm_provider is "anthropic" and api_key is not set.'
    required: false
  anthropic_model:
    description: 'Anthropic model name. Only used when llm_provider is "anthropic".'
    required: false
  anthropic_base_url:
    description: 'Optional override for an enterprise/custom endpoint (e.g. a Bedrock or Vertex proxy speaking the Anthropic API shape). Only used when llm_provider is "anthropic".'
    required: false
  anthropic_workspace_id:
    description: 'Only needed if your Anthropic key is not scoped to a single workspace -- the API then requires this header on every request (error message names it explicitly: "This API key is not scoped to a workspace..."). Find your workspace ID in the Anthropic Console, or regenerate the key with a specific workspace selected to avoid needing this at all. Only used when llm_provider is "anthropic".'
    required: false
  validator_model:
    description: 'Optional separate (usually cheaper/faster) model for the second-pass finding validator, for whichever provider is configured. Defaults to the main model.'
    required: false

  # ── Target repo / PR context ────────────────────────────────────────────
  github_token:
    description: 'Token used to read the target repo and post PR comments / create Issues. Defaults to the workflow''s automatic GITHUB_TOKEN, which is sufficient for same-repo runs.'
    required: false
    default: ${{ github.token }}
  target_repo:
    description: 'Override for which repo to clone for full-code context. Defaults to the repo the PR belongs to.'
    required: false
  target_branch:
    description: 'Override for which branch to clone. Defaults to the PR''s head branch.'
    required: false
  target_repo_path:
    description: 'Local path to clone the target repo into.'
    required: false
    default: './target-repo'
  output_dir:
    description: 'Local directory to write review output/artifacts into.'
    required: false
    default: './reviews'

  # ── Review behavior ──────────────────────────────────────────────────────
  min_severity:
    description: 'Minimum severity to report (P1/P2/P3).'
    required: false
    default: 'P3'
  follow_intent_links:
    description: 'Whether to fetch links found in the PR description (best-effort — auth-gated or JS-rendered pages like Notion/Linear/Jira/Confluence usually will not yield usable content) and use the PR description plus any fetched content as "stated intent" to check the implementation against. Set to "false" to disable outbound fetches to URLs found in PR text entirely (e.g. if your org restricts CI egress).'
    required: false
    default: 'true'
  post_github_comments:
    description: 'Whether to post findings as PR review comments.'
    required: false
    default: 'true'
  validate_findings:
    description: 'Whether to run the second-pass validator (CONFIRMED / FALSE_POSITIVE / UNCERTAIN) before posting/gating/ticketing.'
    required: false
    default: 'true'
  ci_gate:
    description: 'Whether to fail this job (non-zero exit) when a merge-blocking confirmed finding is present.'
    required: false
    default: 'true'
  gate_min_severity:
    description: 'Minimum severity that counts as merge-blocking for the CI gate.'
    required: false
    default: 'P1'

  # ── Test-coverage scan paths (optional) ──────────────────────────────────
  ut_path:
    description: 'Comma-separated unit test path(s)/glob(s) for coverage scanning.'
    required: false
  it_path:
    description: 'Comma-separated integration test path(s)/glob(s).'
    required: false
  component_test_path:
    description: 'Comma-separated component test path(s)/glob(s).'
    required: false
  contract_test_path:
    description: 'Comma-separated contract test path(s)/glob(s).'
    required: false

  # ── Ticket creation (optional) ────────────────────────────────────────────
  create_tickets:
    description: 'Whether to file a ticket for confirmed findings. Auto-enabled if Jira vars are set or ticket_provider is github-issues.'
    required: false
  create_tickets_for:
    description: '"merge-blocking" (default) or "all-confirmed" — which confirmed findings get tickets.'
    required: false
    default: 'merge-blocking'
  ticket_provider:
    description: '"jira", "github-issues", or "dry-run".'
    required: false
  product_label:
    description: 'Base label used on created tickets (Jira and GitHub Issues) — e.g. "<product_label>-confirmed-bug" on GitHub Issues, and as a Jira label. Defaults to "myco". Override per-client if they want their own label scheme instead.'
    required: false
  github_issue_labels:
    description: 'Comma-separated extra labels to add to created GitHub Issues.'
    required: false
  ticket_github_repo:
    description: 'Override for which "owner/repo" GitHub Issues get filed into. Defaults to the repo the PR belongs to.'
    required: false
  jira_base_url:
    description: 'Jira base URL, e.g. https://yourteam.atlassian.net.'
    required: false
  jira_email:
    description: 'Jira account email used for API auth.'
    required: false
  jira_token:
    description: 'Jira API token.'
    required: false
  jira_project:
    description: 'Jira project key to file tickets under.'
    required: false
  jira_issue_type:
    description: 'Jira issue type name (e.g. "Bug").'
    required: false
  jira_labels:
    description: 'Comma-separated labels to add to created Jira issues.'
    required: false
  jira_assignee_account_id:
    description: 'Jira accountId to assign created issues to.'
    required: false

  # ── Required Myco metrics reporting ─────────────────────────────────────
  metrics_endpoint:
    description: 'Required Myco ingestion URL. POSTs a privacy-minimized summary (counts + finding titles/severity/verdict — never file paths, root cause, fix text, or code) after every review.'
    required: true
  metrics_api_key:
    description: 'Required bearer token for the Myco metrics ingestion endpoint.'
    required: true
  client_id:
    description: 'Required stable identifier for this client in the Myco metrics store.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Verify required Myco metrics configuration
      shell: bash
      env:
        METRICS_ENDPOINT: ${{ inputs.metrics_endpoint }}
        METRICS_API_KEY: ${{ inputs.metrics_api_key }}
        CLIENT_ID: ${{ inputs.client_id }}
      run: |
        test -n "$METRICS_ENDPOINT" || { echo "::error::Myco requires metrics_endpoint. Set the MYCO_METRICS_ENDPOINT Actions variable and map it to this action input."; exit 1; }
        test -n "$METRICS_API_KEY" || { echo "::error::Myco requires metrics_api_key. Check that MYCO_METRICS_API_KEY is an accessible Actions secret for this PR; its value is not printed."; exit 1; }
        test -n "$CLIENT_ID" || { echo "::error::Myco requires client_id. Set the MYCO_CLIENT_ID Actions variable and map it to this action input."; exit 1; }
    - name: Run Myco PR Reviewer
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        PR_LINK: ${{ inputs.pr_link }}
        LLM_PROVIDER: ${{ inputs.llm_provider || 'openai' }}
        API_KEY: ${{ inputs.api_key }}
        LITELLM_API_KEY: ${{ inputs.litellm_api_key }}
        LITELLM_BASE_URL: ${{ inputs.litellm_base_url }}
        LITELLM_MODEL: ${{ inputs.litellm_model }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
        VALIDATOR_MODEL: ${{ inputs.validator_model }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO: ${{ inputs.target_repo }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        TARGET_REPO_PATH: ${{ inputs.target_repo_path }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        MIN_SEVERITY: ${{ inputs.min_severity }}
        FOLLOW_INTENT_LINKS: ${{ inputs.follow_intent_links }}
        POST_GITHUB_COMMENTS: ${{ inputs.post_github_comments }}
        VALIDATE_FINDINGS: ${{ inputs.validate_findings }}
        CI_GATE: ${{ inputs.ci_gate }}
        GATE_MIN_SEVERITY: ${{ inputs.gate_min_severity }}
        UT_PATH: ${{ inputs.ut_path }}
        IT_PATH: ${{ inputs.it_path }}
        COMPONENT_TEST_PATH: ${{ inputs.component_test_path }}
        CONTRACT_TEST_PATH: ${{ inputs.contract_test_path }}
        CREATE_TICKETS: ${{ inputs.create_tickets }}
        CREATE_TICKETS_FOR: ${{ inputs.create_tickets_for }}
        TICKET_PROVIDER: ${{ inputs.ticket_provider }}
        PRODUCT_LABEL: ${{ inputs.product_label }}
        GITHUB_ISSUE_LABELS: ${{ inputs.github_issue_labels }}
        TICKET_GITHUB_REPO: ${{ inputs.ticket_github_repo }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_TOKEN: ${{ inputs.jira_token }}
        JIRA_PROJECT: ${{ inputs.jira_project }}
        JIRA_ISSUE_TYPE: ${{ inputs.jira_issue_type }}
        JIRA_LABELS: ${{ inputs.jira_labels }}
        JIRA_ASSIGNEE_ACCOUNT_ID: ${{ inputs.jira_assignee_account_id }}
        METRICS_ENDPOINT: ${{ inputs.metrics_endpoint }}
        METRICS_API_KEY: ${{ inputs.metrics_api_key }}
        CLIENT_ID: ${{ inputs.client_id }}

branding:
  icon: 'eye'
  color: 'blue'
