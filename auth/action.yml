name: 'Myco Entitlement Authorizer'
description: 'Requests an Entitlement Grant token from the Myco Control Plane using GitHub Actions OIDC.'
author: 'Myco'
inputs:
  control_plane_url:
    description: 'Myco Control Plane URL'
    required: false
    default: ''
  oidc_audience:
    description: 'Audience claim for GitHub OIDC token'
    required: false
    default: ''
outputs:
  grant:
    description: 'Entitlement Grant E-JWT token'
    value: ${{ steps.auth.outputs.grant }}
  client_id:
    description: 'Customer ID / Client identifier'
    value: ${{ steps.auth.outputs.client_id }}
  metrics_endpoint:
    description: 'Metrics ingestion endpoint'
    value: ${{ steps.auth.outputs.metrics_endpoint }}
runs:
  using: 'composite'
  steps:
    - name: Authorize with Myco Control Plane
      id: auth
      shell: bash
      env:
        MYCO_CONTROL_PLANE_URL: ${{ inputs.control_plane_url }}
        CONTROL_PLANE_URL: ${{ inputs.control_plane_url }}
        MYCO_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
      run: node "${{ github.action_path }}/index.js"
